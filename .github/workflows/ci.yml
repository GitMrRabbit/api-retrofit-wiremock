name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test
      - name: Generate Allure report
        run: ./gradlew allureReport
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results/
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/reports/allure-report/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report

      - name: Debug - List downloaded files
        run: |
          echo "=== Directory structure after download ==="
          ls -la
          echo ""
          echo "=== allureReport folder contents ==="
          ls -la allureReport/ || echo "No allureReport folder"
          echo ""
          echo "=== Check if index.html exists ==="
          find . -name "index.html" -type f 2>/dev/null

      - name: Prepare deployment
        run: |
          if [ ! -f "allureReport/index.html" ]; then
            echo "ERROR: index.html not found in allureReport/"
            exit 1
          fi
          
          mkdir -p ./deploy-folder
          
          cp -r allureReport/* ./deploy-folder/
          
          echo "=== Deployed structure ==="
          ls -la ./deploy-folder/
          
          cat > ./deploy-folder/redirect.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta http-equiv="refresh" content="0; url=./">
              <title>Allure Test Report</title>
          </head>
          <body>
              <p>Allure report is available at the root.</p>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./deploy-folder
          force_orphan: true
          keep_files: false