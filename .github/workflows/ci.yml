name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test
      - name: Generate Allure report
        run: ./gradlew allureReport
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results/
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/reports/allure-report/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report

      - name: Check report structure
        id: check_structure
        run: |
          echo "=== Current directory structure ==="
          ls -la
          echo ""
          echo "=== Looking for Allure report ==="
          
          if [ -f "allure-report/index.html" ]; then
            echo "Report found at: allure-report/"
            echo "SOURCE_PATH=." >> $GITHUB_OUTPUT
            echo "REPORT_PATH=allure-report" >> $GITHUB_OUTPUT
          elif [ -f "build/reports/allure-report/index.html" ]; then
            echo "Report found at: build/reports/allure-report/"
            echo "SOURCE_PATH=build/reports/allure-report" >> $GITHUB_OUTPUT
            echo "REPORT_PATH=allure-report" >> $GITHUB_OUTPUT
          elif [ -f "index.html" ]; then
            echo "Report found in current directory"
            echo "SOURCE_PATH=." >> $GITHUB_OUTPUT
            echo "REPORT_PATH=." >> $GITHUB_OUTPUT
          else
            echo "ERROR: Could not find Allure report index.html"
            echo "Listing all index.html files:"
            find . -name "index.html" 2>/dev/null
            exit 1
          fi

      - name: Prepare deployment
        run: |
          mkdir -p ./deploy-folder
          
          SOURCE_PATH="${{ steps.check_structure.outputs.SOURCE_PATH }}"
          REPORT_PATH="${{ steps.check_structure.outputs.REPORT_PATH }}"
          
          echo "Copying from: $SOURCE_PATH/$REPORT_PATH"
          
          if [ "$REPORT_PATH" = "." ]; then
            cp -r "$SOURCE_PATH"/* ./deploy-folder/
          else
            cp -r "$SOURCE_PATH/$REPORT_PATH"/* ./deploy-folder/
          fi
          
          ls -la ./deploy-folder/
          echo ""
          echo "=== Checking for index.html ==="
          ls -la ./deploy-folder/index.html || echo "ERROR: No index.html!"
          
          cat > ./deploy-folder/redirect.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta http-equiv="refresh" content="0; url=/allure-report/">
              <title>Redirecting to Allure Report</title>
          </head>
          <body>
              <p>Redirecting to <a href="/allure-report/">Allure Report</a>...</p>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./deploy-folder
          force_orphan: true
          keep_files: false